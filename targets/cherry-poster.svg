<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d9e2"/>
      <stop offset="45%" stop-color="#f0c3d2"/>
      <stop offset="100%" stop-color="#e8b0c4"/>
    </linearGradient>
    <linearGradient id="cp-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c2f2a"/>
      <stop offset="100%" stop-color="#7a201d"/>
    </linearGradient>
    <radialGradient id="cp-sun" cx="0.72" cy="0.2" r="0.35">
      <stop offset="0%" stop-color="#fff6ea" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cp-canopy" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffe1ec"/>
      <stop offset="100%" stop-color="#f7b9d0"/>
    </linearGradient>
  </defs>

  <!-- backdrop scene: static (id only) -->
  <rect id="cp-sky-rect" width="800" height="1000" fill="url(#cp-sky)"/>
  <rect id="cp-sunglow" width="800" height="1000" fill="url(#cp-sun)"/>
  <!-- red temple wall with lattice doors -->
  <g id="cp-temple">
    <rect x="60" y="430" width="680" height="380" fill="url(#cp-wall)"/>
    <rect x="60" y="430" width="680" height="14" fill="#c98a3e"/>
    <rect x="60" y="796" width="680" height="14" fill="#2a1512"/>
    <g fill="#3a1512" opacity="0.85">
      <rect x="110" y="470" width="120" height="300" rx="4"/>
      <rect x="290" y="470" width="120" height="300" rx="4"/>
      <rect x="470" y="470" width="120" height="300" rx="4"/>
      <rect x="620" y="470" width="90"  height="300" rx="4"/>
    </g>
    <g stroke="#c98a3e" stroke-width="2" opacity="0.5">
      <line x1="170" y1="470" x2="170" y2="770"/>
      <line x1="350" y1="470" x2="350" y2="770"/>
      <line x1="530" y1="470" x2="530" y2="770"/>
      <line x1="110" y1="560" x2="230" y2="560"/>
      <line x1="290" y1="560" x2="410" y2="560"/>
      <line x1="470" y1="560" x2="590" y2="560"/>
    </g>
  </g>
  <!-- tree trunks -->
  <g id="cp-trunks" fill="#4a3428">
    <path d="M 235,810 C 250,700 240,600 260,470 L 278,470 C 262,600 272,700 258,810 Z"/>
    <path d="M 560,810 C 545,700 556,600 540,470 L 522,470 C 540,600 528,700 542,810 Z"/>
  </g>
  <!-- blossom canopy -->
  <g id="cp-canopy-shape">
    <ellipse cx="250" cy="360" rx="230" ry="150" fill="url(#cp-canopy)"/>
    <ellipse cx="560" cy="330" rx="250" ry="160" fill="url(#cp-canopy)"/>
    <ellipse cx="410" cy="250" rx="200" ry="130" fill="#ffe8f1"/>
  </g>
  <!-- grass strip -->
  <rect id="cp-grass" x="0" y="810" width="800" height="190" fill="#8fae5b"/>

  <!-- THE PETALS: hero falling-motion target (captured motion → field replay) -->
  <g class="layer" data-name="petals">
    <g fill="#ffd7e6">
      <ellipse cx="180" cy="520" rx="7" ry="4" transform="rotate(25 180 520)"/>
      <ellipse cx="320" cy="470" rx="6" ry="4" transform="rotate(-15 320 470)"/>
      <ellipse cx="450" cy="560" rx="8" ry="5" transform="rotate(40 450 560)"/>
      <ellipse cx="560" cy="500" rx="6" ry="4" transform="rotate(10 560 500)"/>
      <ellipse cx="640" cy="580" rx="7" ry="4" transform="rotate(-30 640 580)"/>
      <ellipse cx="240" cy="620" rx="6" ry="4" transform="rotate(50 240 620)"/>
      <ellipse cx="390" cy="660" rx="8" ry="5" transform="rotate(-20 390 660)"/>
      <ellipse cx="520" cy="640" rx="6" ry="4" transform="rotate(30 520 640)"/>
      <ellipse cx="150" cy="700" rx="7" ry="4" transform="rotate(-40 150 700)"/>
      <ellipse cx="300" cy="740" rx="6" ry="4" transform="rotate(15 300 740)"/>
      <ellipse cx="470" cy="720" rx="8" ry="5" transform="rotate(-25 470 720)"/>
      <ellipse cx="610" cy="700" rx="6" ry="4" transform="rotate(45 610 700)"/>
      <ellipse cx="210" cy="560" rx="6" ry="4" transform="rotate(-10 210 560)"/>
      <ellipse cx="500" cy="450" rx="7" ry="4" transform="rotate(35 500 450)"/>
      <ellipse cx="360" cy="600" rx="6" ry="4" transform="rotate(-35 360 600)"/>
    </g>
  </g>

  <!-- TITLE -->
  <g class="layer" data-name="title">
    <text x="400" y="900" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="76" font-weight="700" fill="#5a2230">Hanami</text>
    <text x="400" y="950" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"
      font-size="18" font-weight="500" letter-spacing="12" fill="#8a4358">SPRING FESTIVAL · KYOTO</text>
  </g>
</svg>
