<svg viewBox="0 0 800 1120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- sky: soft dawn gradient -->
    <linearGradient id="cx-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f7c8a8"/>
      <stop offset="30%" stop-color="#f3b39a"/>
      <stop offset="62%" stop-color="#e79fa0"/>
      <stop offset="100%" stop-color="#c98bad"/>
    </linearGradient>
    <radialGradient id="cx-sun" cx="0.68" cy="0.28" r="0.42">
      <stop offset="0%"  stop-color="#fff4e2" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffe0bd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe0bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cx-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#caa0b8"/>
      <stop offset="45%" stop-color="#9d7fb0"/>
      <stop offset="100%" stop-color="#6f5f97"/>
    </linearGradient>
    <linearGradient id="cx-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c5b86"/>
      <stop offset="100%" stop-color="#5b4574"/>
    </linearGradient>
    <linearGradient id="cx-flag" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#e6462f"/>
    </linearGradient>
    <radialGradient id="cx-bloom" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#ffe6ef"/>
      <stop offset="100%" stop-color="#f6b8d0"/>
    </radialGradient>
    <linearGradient id="cx-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1630" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1c1630" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="cx-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="cx-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3a2450" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ===== STATIC BACKDROP (id-only, not selectable) ===== -->
  <rect id="cx-sky-rect" width="800" height="1120" fill="url(#cx-sky)"/>
  <rect id="cx-sun-glow" width="800" height="760" fill="url(#cx-sun)"/>
  <circle id="cx-sun-disc" cx="544" cy="300" r="54" fill="#fff6ea"/>

  <!-- distant headland -->
  <path id="cx-headland" d="M 0,640 C 150,600 300,624 430,612 C 560,600 690,626 800,608 L 800,720 L 0,720 Z"
        fill="url(#cx-hill)" opacity="0.9"/>

  <!-- sea -->
  <rect id="cx-sea-rect" x="0" y="690" width="800" height="230" fill="url(#cx-sea)"/>
  <!-- sun reflection on sea -->
  <g id="cx-reflection" opacity="0.5" fill="#ffe6c4">
    <rect x="500" y="712" width="90" height="5" rx="2"/>
    <rect x="486" y="736" width="118" height="5" rx="2"/>
    <rect x="500" y="760" width="90" height="5" rx="2"/>
    <rect x="514" y="784" width="62" height="4" rx="2"/>
  </g>

  <!-- foreground beach + dune -->
  <path id="cx-beach" d="M 0,900 C 200,868 420,884 620,868 C 700,861 760,868 800,864 L 800,1120 L 0,1120 Z"
        fill="#d7b48c"/>
  <path id="cx-beach-shadow" d="M 0,930 C 220,904 440,916 640,902 C 720,896 770,902 800,900 L 800,970 L 0,970 Z"
        fill="#c79d76" opacity="0.6"/>

  <!-- pole (static backdrop for the flag) -->
  <g id="cx-pole">
    <rect x="150" y="330" width="9" height="590" rx="4" fill="#3b3350"/>
    <rect x="151.5" y="334" width="2.5" height="582" fill="#c7bce0" opacity="0.4"/>
    <circle cx="154.5" cy="324" r="8" fill="#f2c14e"/>
  </g>

  <!-- tree trunk (static backdrop for the blossom) -->
  <path id="cx-trunk" d="M 648,900 C 636,800 648,720 632,600 L 660,600 C 648,720 660,800 672,900 Z" fill="#5a4636"/>

  <!-- ===== ANIMATABLE LAYERS (class=layer + data-name) ===== -->

  <!-- 1) FLAG — cloth-wave (name 'flag' auto-enables geometry deform) -->
  <g class="layer" data-name="flag" filter="url(#cx-shadow)">
    <path d="M 159,352
             C 250,338 340,372 430,356 C 500,344 556,354 596,374
             L 596,388 C 556,420 496,406 430,426 C 364,446 286,420 216,446
             C 192,455 172,459 159,462 Z" fill="url(#cx-flag)"/>
    <path d="M 168,392 C 250,378 340,410 428,394 C 492,383 548,392 590,408"
          stroke="#a82f1e" stroke-width="3" fill="none" opacity="0.4"/>
    <path d="M 166,372 C 240,360 330,388 414,374" stroke="#ffb59e" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>

  <!-- 2) BLOSSOM CANOPY — captured sway/bloom motion -->
  <g class="layer" data-name="blossom">
    <ellipse cx="660" cy="540" rx="150" ry="118" fill="url(#cx-bloom)" opacity="0.55"/>
    <ellipse cx="600" cy="500" rx="92" ry="74" fill="#ffe0ec"/>
    <ellipse cx="712" cy="510" rx="88" ry="70" fill="#ffd3e4"/>
    <ellipse cx="656" cy="576" rx="96" ry="72" fill="#ffdcea"/>
    <ellipse cx="626" cy="522" rx="60" ry="48" fill="#fff0f6"/>
    <g fill="#fff7fb">
      <circle cx="612" cy="486" r="11"/><circle cx="700" cy="498" r="10"/>
      <circle cx="666" cy="470" r="9"/><circle cx="640" cy="556" r="10"/>
      <circle cx="712" cy="560" r="9"/><circle cx="592" cy="540" r="9"/>
      <circle cx="682" cy="530" r="8"/><circle cx="628" cy="566" r="8"/>
    </g>
  </g>

  <!-- 3) CLOUDS — captured drift motion -->
  <g class="layer" data-name="clouds" opacity="0.85">
    <g fill="#ffe9dc" filter="url(#cx-soft)">
      <ellipse cx="230" cy="150" rx="120" ry="30"/>
      <ellipse cx="300" cy="172" rx="90"  ry="24"/>
      <ellipse cx="600" cy="110" rx="110" ry="26"/>
      <ellipse cx="668" cy="128" rx="76"  ry="20"/>
    </g>
  </g>

  <!-- 4) SEAGRASS / DUNE GRASS — captured wind-sway motion -->
  <g class="layer" data-name="grass">
    <g stroke="#6f6236" stroke-width="4" fill="none" opacity="0.92">
      <path d="M 60,1120 C 66,1000 56,946 78,884"/>
      <path d="M 96,1120 C 90,988 108,940 84,876"/>
      <path d="M 132,1120 C 140,1000 124,948 150,884"/>
      <path d="M 168,1120 C 162,992 178,944 156,882"/>
      <path d="M 300,1120 C 308,1000 292,946 318,886"/>
      <path d="M 336,1120 C 328,990 346,942 324,880"/>
      <path d="M 372,1120 C 380,1000 364,948 390,888"/>
      <path d="M 500,1120 C 508,1002 492,948 520,890"/>
      <path d="M 536,1120 C 528,990 546,942 524,882"/>
      <path d="M 572,1120 C 580,1002 564,950 590,892"/>
    </g>
    <g fill="#8a7940" opacity="0.9">
      <ellipse cx="78" cy="882" rx="5" ry="15" transform="rotate(-12 78 882)"/>
      <ellipse cx="150" cy="882" rx="5" ry="15" transform="rotate(10 150 882)"/>
      <ellipse cx="318" cy="884" rx="5" ry="15" transform="rotate(-10 318 884)"/>
      <ellipse cx="390" cy="886" rx="5" ry="15" transform="rotate(11 390 886)"/>
      <ellipse cx="520" cy="888" rx="5" ry="15" transform="rotate(-9 520 888)"/>
      <ellipse cx="590" cy="890" rx="5" ry="15" transform="rotate(12 590 890)"/>
    </g>
  </g>

  <!-- ===== TITLE ===== -->
  <rect id="cx-title-panel" x="0" y="936" width="800" height="184" fill="url(#cx-panel)"/>
  <g class="layer" data-name="title">
    <text x="400" y="1030" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="82" font-weight="700" letter-spacing="2" fill="#fdf4ee">Windward</text>
    <text x="400" y="1074" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"
      font-size="19" font-weight="500" letter-spacing="13" fill="#f0cdb8">COASTAL RETREATS · EST. 1962</text>
  </g>
</svg>
