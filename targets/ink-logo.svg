<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="il-bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="100%" stop-color="#ece6d8"/>
    </linearGradient>
    <linearGradient id="il-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- rice-paper backdrop (static) -->
  <rect id="il-bg-rect" width="800" height="1000" fill="url(#il-bg)"/>
  <circle id="il-seal" cx="600" cy="720" r="46" fill="none" stroke="#b23b2e" stroke-width="4" opacity="0.85"/>
  <text id="il-seal-mark" x="600" y="736" text-anchor="middle" font-family="Georgia, serif"
    font-size="42" fill="#b23b2e" opacity="0.85">墨</text>

  <!-- THE INK STROKE: hero brush object (captured Ink Bloom → field replay).
       A single expressive enso-like brush sweep — points along the stroke let
       the trajectory field bloom/warp it. -->
  <g class="layer" data-name="ink">
    <path d="M 400,180
             C 250,190 150,320 168,470
             C 184,610 300,700 430,690
             C 560,680 650,560 622,430
             C 600,326 520,286 470,300"
          fill="none" stroke="url(#il-ink)" stroke-width="46" stroke-linecap="round"/>
    <path d="M 470,300 C 500,296 540,318 560,360"
          fill="none" stroke="#080808" stroke-width="30" stroke-linecap="round" opacity="0.9"/>
    <circle cx="212" cy="360" r="9" fill="#111"/>
    <circle cx="300" cy="230" r="6" fill="#111"/>
    <circle cx="470" cy="700" r="7" fill="#111"/>
  </g>

  <!-- TITLE -->
  <g class="layer" data-name="title">
    <text x="400" y="850" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="82" font-weight="700" fill="#141414">SUMI</text>
    <text x="400" y="900" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"
      font-size="18" font-weight="500" letter-spacing="14" fill="#555">INK &amp; DESIGN STUDIO</text>
  </g>
</svg>
