<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a63"/><stop offset="45%" stop-color="#4a5c8a"/>
      <stop offset="78%" stop-color="#8a7a9e"/><stop offset="100%" stop-color="#c98f86"/>
    </linearGradient>
    <linearGradient id="cc-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7196"/><stop offset="55%" stop-color="#3a5074"/>
      <stop offset="100%" stop-color="#24344f"/>
    </linearGradient>
    <linearGradient id="cc-cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3242"/><stop offset="100%" stop-color="#241f2e"/>
    </linearGradient>
    <linearGradient id="cc-beam" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.85"/><stop offset="100%" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cc-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141020" stop-opacity="0"/><stop offset="100%" stop-color="#141020" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="cc-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- backdrop -->
  <rect id="cc-sky" width="800" height="1000" fill="url(#cc-sky)"/>
  <g id="cc-stars" fill="#eef0ff" opacity="0.8">
    <circle cx="120" cy="80" r="1.4"/><circle cx="300" cy="120" r="1"/><circle cx="500" cy="70" r="1.3"/>
    <circle cx="220" cy="200" r="1"/><circle cx="640" cy="140" r="1.2"/>
  </g>
  <!-- sea -->
  <rect id="cc-sea-rect" x="0" y="560" width="800" height="440" fill="url(#cc-sea)"/>
  <!-- headland cliff with lighthouse (static) -->
  <path id="cc-cliff-rock" d="M 480,560 C 500,470 540,440 560,400 C 600,440 640,500 660,560 L 800,560 L 800,1000 L 480,1000 Z" fill="url(#cc-cliff)"/>
  <g id="cc-lighthouse">
    <rect x="548" y="300" width="26" height="110" fill="#e8e2dc"/>
    <rect x="548" y="330" width="26" height="14" fill="#c0392b"/>
    <rect x="548" y="366" width="26" height="14" fill="#c0392b"/>
    <rect x="544" y="290" width="34" height="14" rx="3" fill="#3a3242"/>
    <circle cx="561" cy="284" r="9" fill="#fff3c4"/>
  </g>

  <!-- ===== ANIMATABLE LAYERS ===== -->

  <!-- 1) LIGHTHOUSE BEAM — slow rotational sweep (apply a gentle sway/pulse) -->
  <g class="layer" data-name="beam">
    <path d="M 561,284 L 180,150 L 200,360 Z" fill="url(#cc-beam)" opacity="0.7"/>
  </g>

  <!-- 2) WAVES — apply ocean/water motion -->
  <g class="layer" data-name="waves">
    <g stroke="#8fa6c4" stroke-width="3.5" fill="none" opacity="0.5">
      <path d="M 20,620 C 120,612 220,628 340,620"/>
      <path d="M 40,690 C 160,682 280,698 440,690"/>
      <path d="M 20,770 C 160,762 300,778 480,770"/>
      <path d="M 40,860 C 180,852 320,868 500,860"/>
      <path d="M 20,940 C 180,932 340,948 520,940"/>
    </g>
    <g fill="#cdddf0" opacity="0.4">
      <ellipse cx="120" cy="700" rx="30" ry="6"/><ellipse cx="300" cy="800" rx="36" ry="7"/>
      <ellipse cx="200" cy="900" rx="30" ry="6"/>
    </g>
  </g>

  <!-- 3) SEAGULLS — flight drift -->
  <g class="layer" data-name="birds">
    <g stroke="#e8e6f2" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M 200,260 C 214,248 226,248 240,260"/><path d="M 260,238 C 274,226 286,226 300,238"/>
      <path d="M 320,272 C 334,260 346,260 360,272"/><path d="M 150,300 C 164,288 176,288 190,300"/>
      <path d="M 300,320 C 314,308 326,308 340,320"/>
    </g>
  </g>

  <!-- 4) CLIFF GRASS — wind sway -->
  <g class="layer" data-name="grass">
    <g stroke="#5a6b48" stroke-width="4" fill="none" opacity="0.85">
      <path d="M 500,1000 C 508,900 492,850 518,790"/><path d="M 560,1000 C 552,890 570,842 548,782"/>
      <path d="M 620,1000 C 628,900 612,850 638,790"/><path d="M 690,1000 C 682,890 700,842 678,784"/>
      <path d="M 750,1000 C 758,900 742,850 768,790"/>
    </g>
  </g>

  <!-- title -->
  <rect id="cc-title-panel" x="0" y="860" width="800" height="140" fill="url(#cc-panel)"/>
  <g class="layer" data-name="title">
    <text x="300" y="940" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="66" font-weight="700" fill="#f4eede">Cape Aria</text>
    <text x="300" y="980" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"
      font-size="16" font-weight="500" letter-spacing="9" fill="#c7b6c8">LIGHTHOUSE COAST · MMXII</text>
  </g>
</svg>
