<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffd9a0"/>
      <stop offset="40%" stop-color="#ffb27a"/>
      <stop offset="75%" stop-color="#e98a86"/>
      <stop offset="100%" stop-color="#b7739a"/>
    </linearGradient>
    <radialGradient id="gh-sun" cx="0.3" cy="0.34" r="0.4">
      <stop offset="0%" stop-color="#fff6e2"/>
      <stop offset="45%" stop-color="#ffdd9c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffdd9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gh-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e79a86"/>
      <stop offset="45%" stop-color="#a87ba0"/>
      <stop offset="100%" stop-color="#6a5a8e"/>
    </linearGradient>
    <linearGradient id="gh-flag" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0%" stop-color="#ff7a59"/><stop offset="100%" stop-color="#e6462f"/>
    </linearGradient>
    <linearGradient id="gh-flag2" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0%" stop-color="#4ec3d6"/><stop offset="100%" stop-color="#2a8fb0"/>
    </linearGradient>
    <linearGradient id="gh-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1830" stop-opacity="0"/><stop offset="100%" stop-color="#2a1830" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="gh-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- backdrop -->
  <rect id="gh-sky" width="800" height="1000" fill="url(#gh-sky)"/>
  <rect id="gh-sunglow" width="800" height="720" fill="url(#gh-sun)"/>
  <circle id="gh-sun-disc" cx="240" cy="300" r="58" fill="#fff6e2"/>
  <!-- far town silhouette -->
  <g id="gh-town" fill="#8a5f83" opacity="0.85">
    <rect x="420" y="540" width="40" height="80"/><rect x="466" y="510" width="30" height="110"/>
    <rect x="502" y="556" width="46" height="64"/><rect x="556" y="500" width="26" height="120"/>
    <polygon points="556,500 569,478 582,500"/>
    <rect x="592" y="540" width="40" height="80"/><rect x="640" y="520" width="34" height="100"/>
    <rect x="684" y="556" width="48" height="64"/><rect x="740" y="530" width="30" height="90"/>
  </g>
  <path id="gh-quay" d="M 0,620 L 800,620 L 800,660 L 0,660 Z" fill="#5a4472"/>

  <!-- water -->
  <rect id="gh-water-rect" x="0" y="660" width="800" height="340" fill="url(#gh-water)"/>
  <g id="gh-sunpath" fill="#ffe6c0" opacity="0.4">
    <rect x="200" y="680" width="84" height="6" rx="3"/><rect x="188" y="712" width="108" height="6" rx="3"/>
    <rect x="204" y="744" width="76" height="5" rx="2"/><rect x="216" y="776" width="52" height="5" rx="2"/>
  </g>

  <!-- masts / poles (static) -->
  <g id="gh-masts" fill="#3a2b4a">
    <rect x="150" y="360" width="6" height="300"/>
    <rect x="640" y="400" width="6" height="260"/>
  </g>

  <!-- ===== ANIMATABLE LAYERS ===== -->

  <!-- 1) FLAG A (name 'flag' → cloth wave) -->
  <g class="layer" data-name="flag" filter="url(#gh-soft)">
    <path d="M 156,376 C 230,364 300,392 360,378 C 410,367 448,376 476,392
             L 476,404 C 448,430 404,418 356,434 C 308,450 250,430 200,450
             C 182,457 168,460 156,462 Z" fill="url(#gh-flag)"/>
  </g>

  <!-- 2) FLAG B (name 'banner' → cloth wave) -->
  <g class="layer" data-name="banner" filter="url(#gh-soft)">
    <path d="M 646,414 C 700,404 750,424 786,412 L 786,422
             C 752,446 706,436 656,452 C 636,459 646,449 646,452 Z" fill="url(#gh-flag2)"/>
  </g>

  <!-- 3) BOATS — bob/sway motion -->
  <g class="layer" data-name="boats">
    <g>
      <path d="M 300,720 C 350,720 430,720 476,720 C 470,752 452,766 388,766 C 336,766 314,750 300,720 Z" fill="#2a2340"/>
      <rect x="384" y="672" width="4" height="48" fill="#2a2340"/>
      <path d="M 388,674 L 430,716 L 388,716 Z" fill="#f2d0b0" opacity="0.9"/>
    </g>
    <g opacity="0.9">
      <path d="M 520,752 C 556,752 610,752 642,752 C 638,776 624,786 578,786 C 542,786 528,772 520,752 Z" fill="#241d38"/>
      <rect x="576" y="716" width="4" height="36" fill="#241d38"/>
      <path d="M 580,718 L 612,748 L 580,748 Z" fill="#e9c3a6" opacity="0.85"/>
    </g>
  </g>

  <!-- 4) WATER RIPPLE -->
  <g class="layer" data-name="water">
    <g stroke="#c98aa0" stroke-width="3" fill="none" opacity="0.45">
      <path d="M 40,700 C 140,694 240,706 340,700"/>
      <path d="M 440,730 C 540,724 640,736 760,730"/>
      <path d="M 80,800 C 220,794 360,806 520,800"/>
      <path d="M 460,860 C 580,854 680,866 780,860"/>
      <path d="M 40,920 C 200,914 360,926 560,920"/>
    </g>
  </g>

  <!-- 5) BIRDS -->
  <g class="layer" data-name="birds">
    <g stroke="#5a3f5e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M 420,220 C 432,210 442,210 454,220"/>
      <path d="M 470,200 C 482,190 492,190 504,200"/>
      <path d="M 520,232 C 532,222 542,222 554,232"/>
      <path d="M 380,250 C 392,240 402,240 414,250"/>
    </g>
  </g>

  <!-- title -->
  <rect id="gh-title-panel" x="0" y="860" width="800" height="140" fill="url(#gh-panel)"/>
  <g class="layer" data-name="title">
    <text x="400" y="940" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="70" font-weight="700" fill="#fdf1e6">Old Harbour</text>
    <text x="400" y="982" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"
      font-size="17" font-weight="500" letter-spacing="11" fill="#f0c9b0">SAILS &amp; SUNSETS · PORT VELA</text>
  </g>
</svg>
