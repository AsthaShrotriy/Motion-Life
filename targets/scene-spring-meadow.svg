<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#a9d8f0"/>
      <stop offset="55%" stop-color="#cfe9f5"/>
      <stop offset="100%" stop-color="#eef8ec"/>
    </linearGradient>
    <radialGradient id="sm-sun" cx="0.74" cy="0.22" r="0.32">
      <stop offset="0%" stop-color="#fffbe8"/><stop offset="55%" stop-color="#fff2c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff2c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sm-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fc97a"/><stop offset="100%" stop-color="#6fb35e"/>
    </linearGradient>
    <linearGradient id="sm-meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7bbf5e"/><stop offset="100%" stop-color="#4f9440"/>
    </linearGradient>
    <radialGradient id="sm-bloom" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#ffe9f1"/><stop offset="100%" stop-color="#f7b6cf"/>
    </radialGradient>
    <linearGradient id="sm-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20401c" stop-opacity="0"/><stop offset="100%" stop-color="#20401c" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="sm-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- backdrop -->
  <rect id="sm-sky" width="800" height="1000" fill="url(#sm-sky)"/>
  <rect id="sm-sunglow" width="800" height="640" fill="url(#sm-sun)"/>
  <circle id="sm-sun-disc" cx="592" cy="176" r="50" fill="#fffbe8"/>
  <path id="sm-hills" d="M 0,560 C 180,500 360,540 520,516 C 640,498 740,528 800,510 L 800,720 L 0,720 Z" fill="url(#sm-hill)"/>
  <path id="sm-hill-shadow" d="M 0,620 C 200,584 400,612 620,596 C 700,590 760,604 800,598 L 800,720 L 0,720 Z" fill="#5ea34d" opacity="0.6"/>
  <rect id="sm-meadow-rect" x="0" y="680" width="800" height="320" fill="url(#sm-meadow)"/>
  <!-- tree trunk (static) -->
  <path id="sm-trunk" d="M 168,760 C 156,660 168,580 152,470 L 180,470 C 168,580 180,660 192,760 Z" fill="#6a4a34"/>

  <!-- ===== ANIMATABLE LAYERS ===== -->

  <!-- 1) BLOSSOM CANOPY — sway/bloom -->
  <g class="layer" data-name="blossom">
    <ellipse cx="180" cy="410" rx="150" ry="120" fill="url(#sm-bloom)" opacity="0.6"/>
    <ellipse cx="126" cy="386" rx="86" ry="70" fill="#ffdbe8"/>
    <ellipse cx="228" cy="392" rx="90" ry="72" fill="#ffcfe0"/>
    <ellipse cx="176" cy="448" rx="92" ry="66" fill="#ffd6e4"/>
    <ellipse cx="150" cy="404" rx="54" ry="44" fill="#fff0f6"/>
    <g fill="#fff7fb">
      <circle cx="128" cy="372" r="10"/><circle cx="222" cy="384" r="9"/><circle cx="184" cy="360" r="8"/>
      <circle cx="160" cy="446" r="9"/><circle cx="230" cy="446" r="8"/><circle cx="110" cy="428" r="8"/>
    </g>
  </g>

  <!-- 2) CLOUDS — drift -->
  <g class="layer" data-name="clouds" opacity="0.92">
    <g fill="#ffffff" filter="url(#sm-soft)">
      <ellipse cx="360" cy="150" rx="110" ry="30"/><ellipse cx="430" cy="172" rx="80" ry="24"/>
      <ellipse cx="680" cy="240" rx="96" ry="26"/><ellipse cx="740" cy="258" rx="66" ry="20"/>
    </g>
  </g>

  <!-- 3) MEADOW GRASS / WILDFLOWERS — wind sway -->
  <g class="layer" data-name="grass">
    <g stroke="#3f8a34" stroke-width="4" fill="none" opacity="0.9">
      <path d="M 60,1000 C 66,900 56,850 78,788"/><path d="M 110,1000 C 104,890 120,842 100,782"/>
      <path d="M 300,1000 C 308,900 292,848 318,788"/><path d="M 350,1000 C 342,888 360,840 338,782"/>
      <path d="M 540,1000 C 548,902 532,850 558,790"/><path d="M 590,1000 C 582,890 600,842 578,784"/>
      <path d="M 720,1000 C 728,902 712,850 738,790"/>
    </g>
    <g fill="#ffd94a"><circle cx="78" cy="786" r="7"/><circle cx="318" cy="786" r="7"/><circle cx="558" cy="788" r="7"/><circle cx="738" cy="788" r="7"/></g>
    <g fill="#ff8ab0"><circle cx="100" cy="780" r="6"/><circle cx="338" cy="780" r="6"/><circle cx="578" cy="782" r="6"/></g>
  </g>

  <!-- 4) BUTTERFLIES / BIRDS — flight drift -->
  <g class="layer" data-name="birds">
    <g stroke="#4a5e2e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M 440,300 C 452,290 462,290 474,300"/><path d="M 490,282 C 502,272 512,272 524,282"/>
      <path d="M 540,312 C 552,302 562,302 574,312"/><path d="M 400,330 C 412,320 422,320 434,330"/>
    </g>
  </g>

  <!-- title -->
  <rect id="sm-title-panel" x="0" y="860" width="800" height="140" fill="url(#sm-panel)"/>
  <g class="layer" data-name="title">
    <text x="400" y="940" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="72" font-weight="700" fill="#fbfff5">Meadowlark</text>
    <text x="400" y="982" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"
      font-size="17" font-weight="500" letter-spacing="11" fill="#dff3d0">SPRING TRAILS · VALE COUNTY</text>
  </g>
</svg>
