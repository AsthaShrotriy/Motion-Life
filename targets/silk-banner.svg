<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sb-bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a0f1c"/>
      <stop offset="55%" stop-color="#3d1526"/>
      <stop offset="100%" stop-color="#160810"/>
    </linearGradient>
    <radialGradient id="sb-glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#7a2740" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a2740" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sb-silk" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%" stop-color="#b8143c"/>
      <stop offset="38%" stop-color="#ff4d6d"/>
      <stop offset="62%" stop-color="#e01044"/>
      <stop offset="100%" stop-color="#8f0a2c"/>
    </linearGradient>
  </defs>

  <!-- backdrop (static: id only) -->
  <rect id="sb-bgrect" width="800" height="1000" fill="url(#sb-bg)"/>
  <rect id="sb-bgglow" width="800" height="1000" fill="url(#sb-glow)"/>

  <!-- THE SILK: hero cloth object; 'banner' name auto-enables wave/geometry -->
  <g class="layer" data-name="banner">
    <path d="M 150,150
             C 300,120 500,180 650,150
             C 662,300 638,470 655,640
             C 505,678 300,612 150,650
             C 168,470 138,300 150,150 Z"
          fill="url(#sb-silk)"/>
    <path d="M 175,250 C 320,222 500,282 632,256" stroke="#ff9db0" stroke-width="3" fill="none" opacity="0.45"/>
    <path d="M 172,400 C 320,372 500,432 640,404" stroke="#7d0724" stroke-width="4" fill="none" opacity="0.4"/>
    <path d="M 178,540 C 320,516 500,566 636,540" stroke="#ff8fa3" stroke-width="2.5" fill="none" opacity="0.4"/>
  </g>

  <!-- TITLE -->
  <g class="layer" data-name="title">
    <text x="400" y="800" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
      font-size="86" font-style="italic" font-weight="700" fill="#f6e9ec">Maison</text>
    <text x="400" y="862" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"
      font-size="22" font-weight="500" letter-spacing="14" fill="#d99bad">SILK &amp; ATELIER</text>
    <text x="400" y="915" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif"
      font-size="14" font-weight="400" letter-spacing="8" fill="#a86b7d">SPRING COLLECTION · PARIS</text>
  </g>
</svg>
